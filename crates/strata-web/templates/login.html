{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<section class="card rounded-xl max-w-md mx-auto">
    <div class="card-head px-4 py-2 rounded-t-xl">
        <h1 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Sign in</h1>
    </div>
    <div class="p-4 space-y-4">
        {% if let Some(message) = error %}
            <div class="rounded-md border-l-4 border-l-red-500 bg-red-950/40 px-3 py-2 text-sm text-red-300">
                {{ message }}
            </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-3">
            <label class="block text-xs text-slate-400">
                Username
                <input class="input mono rounded-md px-3 py-2 w-full mt-1"
                       type="text" name="username" autocomplete="username" required>
            </label>
            <label class="block text-xs text-slate-400">
                Password
                <input class="input mono rounded-md px-3 py-2 w-full mt-1"
                       type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="btn rounded-md px-4 py-2 text-sm w-full" type="submit">Sign in</button>
        </form>

        <p class="text-xs text-slate-500">
            No account yet? <a class="text-[#4da3ff] hover:underline" href="/register">Create one</a>.
        </p>
    </div>
</section>
{% endblock %}
