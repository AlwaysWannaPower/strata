[package]
name = "strata-web"
version.workspace = true
edition.workspace = true
description = "Strata web service (axum + htmx + Tailwind): server-rendered staging pipeline over strata-core's application API."

[dependencies]
# Движок доступен ТОЛЬКО через `strata_core::api` — см. доки в src/main.rs.
strata-core = { path = "../strata-core" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
askama = "0.14"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.39"
tracing = "0.1"

# --- аутентификация и хранилище (срез платформы) --------------------------
# Сессии как middleware для tower/axum (на cookie, хранилище на сервере).
tower-sessions = "0.15"
# SQLite для пользователей; переезд на Postgres — смена URL + feature.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "macros", "migrate"] }
# Хэширование паролей Argon2id (RustCrypto) — рекомендуемый выбор по умолчанию.
argon2 = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
