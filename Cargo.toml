# Workspace manifest for the `strata` Data Engineering Workbench.
#
# Участники workspace:
#   crates/strata-core — библиотека: вся логика данных (Polars/Parquet), без UI.
#   crates/strata-web  — сервис: axum + htmx, вызывает только strata_core::api.
#
# Dioxus-десктоп (crates/strata-app) удалён: его последняя версия — коммит
# 0838e06; учебные заметки по нему лежат в docs/archive/.
#
# Edition "2024" and version are shared via [workspace.package].
[workspace]
resolver = "3"
members = ["crates/strata-core", "crates/strata-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Rust, поэтому: thin-LTO + codegen-units=1 + strip — скорость и размер бинаря
# в release; dev-сборка остаётся быстрой для итераций.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
